name: Release on record

# The same package gate runs on PRs and the actual default-branch commit after rebase.
# Relative reusable workflows resolve from this commit, never a remembered PR SHA.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-on-record-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml

  release:
    name: Release the recorded version
    needs: check
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact commit that passed the package gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP for dependency verification
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, zip
          coverage: none
          tools: composer:v2
      - name: Resolve production dependencies from the registry
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative
      - name: Verify the actual upstream releases and external attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/check-release-dependencies.sh . "$RUNNER_TEMP/dependency-verification.json"

      - name: Publish or verify the recorded release
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash tools/release-on-record.sh
